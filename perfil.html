<!DOCTYPE html>
<html lang="es-ES">
<head>
    <title>Cargando perfil...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type=image/x-icon href="29900089/favicon.ico">
    <link rel="stylesheet" href="css/style.css"/>
    <meta charset="UTF-8">
    <script src="https://kit.fontawesome.com/5d72166fb5.js" crossorigin="anonymous"></script>

    <script src="conf/configES.json"></script>

    <script src="js/index.js" defer></script>
</head>
<body>
    <div id="perfil-container" class="container">
        <div class="container-card">
            <div class="left-container-card">
            </div>
            <div class="right-container-card">
                <h1 id="perfil-nombre"></h1>
                <p class="descripcion" id="perfil-descripcion"></p>
                <div class="two-column-list">
                    <ul>
                        <li>
                            <span class="question" id="label-color"></span>
                            <span class="answer" id="value-color"></span>
                        </li>
                        <li><span class="question" id="label-libro"></span><span class="answer" id="value-libro"></span></li>
                        <li><span class="question" id="label-musica"></span><span class="answer" id="value-musica"></span></li>
                        <li><span class="question" id="label-video_juego"></span><span class="answer" id="value-video_juego"></span></li>
                        <li><span class="question" id="label-lenguajes"></span><span class="answer" id="value-lenguajes"></span></li>
                    </ul>
                </div>
                <div class="mail">
                    <p id="perfil-email-container"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
