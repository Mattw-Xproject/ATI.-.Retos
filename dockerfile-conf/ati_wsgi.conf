<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # --- CONFIGURACIÓN DEL ENTORNO VIRTUAL ---
    # python-home: Donde está el venv (/home/apps/web_env)
    # python-path: Donde está tu código (/var/www/html/ATI)
    WSGIDaemonProcess ati_app python-home=/home/apps/web_env python-path=/var/www/html/ATI
    
    WSGIProcessGroup ati_app
    WSGIApplicationGroup %{GLOBAL}
    # -----------------------------------------

    WSGIScriptAlias /ATI/index.py /var/www/html/ATI/index.py

    # Alias para estáticos (CSS, JS, Imágenes)
    Alias /ATI/css /var/www/html/ATI/css
    Alias /ATI/js /var/www/html/ATI/js
    Alias /ATI/datos /var/www/html/ATI/datos
    
    # Importante: Permitir servir archivos desde la raíz de ATI para las carpetas de CI (ej: /ATI/29900089/foto.jpg)
    <Directory /var/www/html/ATI>
        Options +ExecCGI +FollowSymLinks
        AddHandler wsgi-script .py
        Require all granted
    </Directory>
</VirtualHost>